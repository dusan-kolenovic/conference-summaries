<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conference lessons</title>
<link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/fonts.css">
<link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/colors.css">
<link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/effects.css">
<style>
  body { margin: 0; background: var(--surface-light, #F5F3F0); color: var(--navy, #1E2A3A); font-family: var(--font-sans, 'Figtree', sans-serif); -webkit-font-smoothing: antialiased; }
  header { background-image: var(--grain), var(--gradient-dawn); background-size: 128px, 100% 100%; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(16px, 5vw, 56px); box-sizing: border-box; }
  header .wrap { padding-top: 96px; padding-bottom: 120px; }
  .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.72); }
  h1 { margin: 24px 0 0; font-weight: 300; font-size: clamp(40px, 6vw, 72px); line-height: 1.05; letter-spacing: -0.03em; color: #fff; }
  header p { margin: 24px 0 0; max-width: 640px; font-size: clamp(18px, 2vw, 22px); line-height: 1.5; color: rgba(255,255,255,0.9); }
  ol { list-style: none; margin: 0; padding: 72px 0 120px; }
  li a { display: grid; grid-template-columns: 160px 1fr; gap: 8px 32px; padding: 28px 0; border-top: 1px solid var(--ink-200, #E2DED8); color: inherit; text-decoration: none; transition: transform 240ms cubic-bezier(0.23, 1, 0.32, 1); }
  li a:hover { transform: translateX(6px); }
  li a:hover .title { color: var(--coral-deep, #D95A3F); }
  .date { font-size: 15px; font-weight: 600; color: var(--coral-deep, #D95A3F); font-variant-numeric: tabular-nums; padding-top: 8px; }
  .title { font-size: clamp(24px, 3vw, 32px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.2; }
  .sub { grid-column: 2; font-size: 17px; line-height: 1.5; color: var(--ink-500, #6B6760); }
  @media (max-width: 640px) { li a { grid-template-columns: 1fr; } .sub { grid-column: 1; } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">Conference digest</div>
  <h1>Conference lessons</h1>
  <p>The best ideas from the talks, and what we can do about them today.</p>
</div></header>
<main class="wrap">
  <ol>
    <!-- Newest first. Copy one <li> per new conference. -->
    <li><a href="2026-09-22-atlassian-state-of-ai-sdlc/">
      <span class="date">Sep 22, 2026</span>
      <span class="title">State of AI SDLC</span>
      <span class="sub">One-day summit run by Atlassian, with Vercel and Dropbox. Ten lessons.</span>
    </a></li>
  </ol>
</main>
</body>
</html>
